spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: '${DB_USER:root}'
    password: '${DB_PASSWORD:}'
    #    url: jdbc:mysql://localhost:3306/mall?characterEncoding=utf-8&useSSL=false
    url: '${DB_URL:jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}'
  redis:
    host: 127.0.0.1
    port: 6379
  rabbitmq:
    addresses: '${RABBITMQ_HOST:127.0.0.1}'
    port: 5672
    username: '${RABBITMQ_USER:guest}'
    password: '${RABBITMQ_PASSWORD:guest}'
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    #这个是控制台日志配置，我这里想用mybatis注入sql语句
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mappers/*.xml
logging:
  pattern:
    console: "[%thread] %-5level %logger{36} - %msg%n"
server:
  servlet:
    session:
      timeout: 120
  port: 8081
